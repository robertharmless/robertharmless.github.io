<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>2 Peter 1 · Read Along</title>
<link rel="apple-touch-icon" href="../artwork.png">
<style>
  :root { --bg:#faf7f2; --fg:#2b2622; --muted:#8a8178; --hi:#fff1c7; --accent:#7a5c2e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1917; --fg:#e9e4dc; --muted:#8f877e; --hi:#4a3c1c; --accent:#d9b778; } }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); }
  body { font: 20px/1.6 Georgia, "Times New Roman", serif; -webkit-text-size-adjust:100%; }
  header { position:sticky; top:0; z-index:2; background:var(--bg); padding:calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom:1px solid rgba(128,128,128,.25); }
  h1 { font: 600 18px/1.2 -apple-system, system-ui, sans-serif; margin:0 0 8px; }
  h1 small { color:var(--muted); font-weight:400; }
  audio { width:100%; }
  .controls { display:flex; gap:8px; margin-top:8px; font-family:-apple-system, system-ui, sans-serif; }
  .controls button { flex:1; font-size:15px; padding:8px; border-radius:10px; border:1px solid rgba(128,128,128,.35); background:transparent; color:var(--fg); }
  main { padding:16px 18px calc(env(safe-area-inset-bottom) + 50vh); max-width:720px; margin:0 auto; }
  .cue { padding:6px 8px; margin:2px -8px; border-radius:8px; transition:background .25s; cursor:pointer; }
  .cue.active { background:var(--hi); }
  .vn { font: 600 12px -apple-system, system-ui, sans-serif; color:var(--accent); vertical-align:super; margin-right:4px; }
  .heading { font: 600 15px -apple-system, system-ui, sans-serif; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  footer { color:var(--muted); font: 13px -apple-system, system-ui, sans-serif; margin-top:24px; }
</style>
</head>
<body>
<header>
  <h1>2 Peter 1 <small>· Berean Standard Bible, read by Bob Souer</small></h1>
  <audio id="audio" controls preload="metadata" playsinline src="https://openbible.com/audio/souer/BSB_61_2Pe_001.mp3"></audio>
  <div class="controls">
    <button id="back">↺ 10s</button>
    <button id="follow" aria-pressed="true">Auto-scroll: On</button>
    <button id="fwd">10s ↻</button>
  </div>
</header>
<main id="text"><p>Loading…</p></main>
<script>
const audio = document.getElementById('audio');
const textEl = document.getElementById('text');
let cues = [], current = -1, follow = true;

function toSec(t){ const p=t.trim().split(':').map(parseFloat); return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; }
function parseVTT(src){
  const out=[]; const blocks=src.replace(/\r/g,'').split(/\n\n+/);
  for(const b of blocks){ const lines=b.split('\n'); const i=lines.findIndex(l=>l.includes('-->')); if(i<0) continue;
    const [s,e]=lines[i].split('-->'); out.push({start:toSec(s), end:toSec(e.split(' ').filter(Boolean)[0]), text:lines.slice(i+1).join(' ')}); }
  return out;
}
function render(){
  textEl.innerHTML='';
  cues.forEach((c,i)=>{
    const d=document.createElement('div'); d.className='cue'; d.dataset.i=i;
    const m=c.text.match(/^(\d+)\s+(.*)$/);
    if(i===0 && /^2 Peter 1$/.test(c.text)){ d.classList.add('heading'); d.textContent=c.text; }
    else if(m){ const v=document.createElement('span'); v.className='vn'; v.textContent=m[1]; d.append(v, document.createTextNode(m[2])); }
    else d.textContent=c.text;
    d.onclick=()=>{ audio.currentTime=c.start+0.01; audio.play(); };
    textEl.appendChild(d);
  });
  const f=document.createElement('footer'); f.textContent='Text: Berean Standard Bible (public domain). Audio: openbible.com. Tap any line to jump there.'; textEl.appendChild(f);
}
function update(){
  const t=audio.currentTime; let idx=-1;
  for(let i=0;i<cues.length;i++){ if(t>=cues[i].start-0.05){ idx=i; } else break; }
  if(idx===current) return;
  if(current>=0) textEl.children[current]?.classList.remove('active');
  current=idx;
  if(idx>=0){ const el=textEl.children[idx]; el.classList.add('active');
    if(follow){ const hdr=document.querySelector('header').offsetHeight; const y=el.getBoundingClientRect().top+scrollY-hdr-window.innerHeight*0.2; scrollTo({top:y, behavior:'smooth'}); } }
}
let raf; function loop(){ update(); raf=requestAnimationFrame(loop); }
audio.addEventListener('play',()=>{ cancelAnimationFrame(raf); loop(); });
audio.addEventListener('pause',()=>{ cancelAnimationFrame(raf); update(); });
audio.addEventListener('seeked',update);
document.getElementById('back').onclick=()=>{ audio.currentTime=Math.max(0,audio.currentTime-10); };
document.getElementById('fwd').onclick=()=>{ audio.currentTime=audio.currentTime+10; };
document.getElementById('follow').onclick=e=>{ follow=!follow; e.target.textContent='Auto-scroll: '+(follow?'On':'Off'); e.target.setAttribute('aria-pressed',follow); if(follow) { current=-1; update(); } };
if('mediaSession' in navigator){ navigator.mediaSession.metadata=new MediaMetadata({title:'2 Peter 1', artist:'Bob Souer', album:'Berean Standard Bible', artwork:[{src:'../artwork.png', sizes:'3000x3000', type:'image/png'}]}); }
fetch('../transcripts/BSB_61_2Pe_001.vtt').then(r=>r.text()).then(t=>{ cues=parseVTT(t); render(); update(); })
  .catch(()=>{ textEl.innerHTML='<p>Could not load the transcript.</p>'; });
</script>
</body>
</html>
